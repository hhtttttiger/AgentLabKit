[project]
name = "agentlabkit-application"
version = "0.1.0"
description = "Framework-neutral application use cases for AgentLabKit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "agentlabkit-agent-runtime>=0.1.0",
  "agentlabkit-evaluation>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
